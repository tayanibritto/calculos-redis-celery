version: "3.9"

services:

  redis:
    image: redis:7-alpine
    container_name: calculo-redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: calculo-fastapi
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: .
    container_name: calculo-celery
    command: celery -A celery_app worker -l info -P solo
    depends_on:
      - redis
